[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dispersion-trading-hec-trading-club"
version = "0.2.0"
description = "Integrated team dispersion research, event analysis and execution-cost tools"
readme = "README.md"
authors = [{name = "Kevin Yang", email = "kevinyang4827@gmail.com"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "scipy==1.17.1",
    "pyarrow==25.0.1",
    "exchange-calendars==4.13.2",
    "wrds==3.1.6",
    "sqlalchemy==1.4.54",
    "statsmodels==0.14.5",
    "matplotlib>=3.10,<4",
    "requests>=2.32,<3",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
dispersion = "src.research.cli:main"
dispersion-events = "src.events.cli:main"
dispersion-costs = "src.backtest.cli:main"
dispersion-trading-hec-trading-club = "src.run_dispersion:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
# Ship maintained project files; local market data and tool caches never belong in releases.
include = ["/src", "/tests", "/scripts", "/configs", "/docs", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.gitignore", "/.gitattributes", "/important_data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
